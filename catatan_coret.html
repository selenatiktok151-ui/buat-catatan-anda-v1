<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORET+</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cinzel:wght@500;700&family=Comic+Neue:wght@700&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* Font Family Definitions */
        .font-klasik { font-family: 'Times New Roman', Times, serif; }
        .font-italic { font-family: 'Playfair Display', serif; font-style: italic; }
        .font-modern { font-family: 'Inter', sans-serif; }
        .font-elegan { font-family: 'Cinzel', serif; }
        .font-cartoon { font-family: 'Comic Neue', cursive; }
        .font-tangan { font-family: 'Caveat', cursive; font-size: 1.25rem; }

        /* Themes CSS */
        .theme-polos { background-color: #ffffff; color: #1f2937; }
        .dark .theme-polos { background-color: #111827; color: #f3f4f6; }

        .theme-buku {
            background-color: #fdfbf7;
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 100% 28px;
            line-height: 28px;
            color: #2d3748;
        }
        .dark .theme-buku {
            background-color: #1a202c;
            background-image: linear-gradient(#2d3748 1px, transparent 1px);
            color: #e2e8f0;
        }

        .theme-kusut {
            background-color: #f4ecd8;
            background-image: radial-gradient(#d6c7a1 15%, transparent 16%), radial-gradient(#d6c7a1 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: #3c2f2f;
        }

        .theme-kuno {
            background-color: #e8d8b7;
            border: 12px solid #8c6d46;
            color: #3a2510;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.3);
        }

        .theme-papan {
            background-color: #22382b;
            color: #f0fdf4;
            border: 8px solid #5c3a21;
            font-family: 'Comic Neue', cursive;
        }

        /* Heading & Text Hierarchy Styling inside Editor Canvas */
        #editor h1 { font-size: 2.25rem; font-weight: 800; line-height: 1.25; margin-top: 0.6em; margin-bottom: 0.3em; }
        #editor h2 { font-size: 1.75rem; font-weight: 700; line-height: 1.3; margin-top: 0.6em; margin-bottom: 0.3em; }
        #editor h3 { font-size: 1.35rem; font-weight: 600; line-height: 1.35; margin-top: 0.5em; margin-bottom: 0.25em; }
        #editor h4 { font-size: 1.15rem; font-weight: 600; line-height: 1.4; margin-top: 0.5em; margin-bottom: 0.25em; }
        #editor h5 { font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.4em; margin-bottom: 0.2em; }
        #editor h6 { font-size: 0.875rem; font-weight: 600; opacity: 0.8; margin-top: 0.4em; margin-bottom: 0.2em; }
        #editor p { margin-bottom: 0.5em; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen flex flex-col font-modern overflow-hidden transition-colors duration-200">

    <!-- Top Menu Header -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 select-none">
        <div class="flex items-center justify-between px-3 py-1.5 text-xs border-b border-gray-100 dark:border-gray-700/50">
            <!-- App Logo & Menus -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <div class="flex items-center font-bold text-indigo-600 dark:text-indigo-400 text-sm tracking-wider mr-1 sm:mr-2 select-none">
                    <i data-lucide="edit-3" class="w-4 h-4 mr-1"></i>
                    <span>CORET+</span>
                </div>

                <!-- File Menu Dropdown -->
                <div class="relative">
                    <button onclick="toggleDropdown(event, 'file-dropdown')" class="hover:bg-gray-100 dark:hover:bg-gray-700 active:bg-gray-200 dark:active:bg-gray-600 px-2.5 py-1.5 rounded-md cursor-pointer flex items-center gap-1 font-medium select-none transition-colors" id="menu-file-btn">
                        <span data-i18n="file">File</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 opacity-60"></i>
                    </button>
                    <div id="file-dropdown" class="dropdown-menu absolute left-0 mt-1.5 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 hidden z-50 py-1 transition-all animate-in fade-in zoom-in-95 duration-100">
                        <button onclick="createNewTab(); closeAllDropdowns();" class="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-between text-xs">
                            <span class="flex items-center"><i data-lucide="file-plus" class="w-3.5 h-3.5 mr-2 text-indigo-500"></i><span data-i18n="newTab">New Tab</span></span>
                            <span class="text-[10px] text-gray-400 font-mono">Ctrl+Alt+N</span>
                        </button>
                        <button onclick="saveFile(); closeAllDropdowns();" class="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-between text-xs">
                            <span class="flex items-center"><i data-lucide="save" class="w-3.5 h-3.5 mr-2 text-green-500"></i><span data-i18n="save">Save</span></span>
                            <span class="text-[10px] text-gray-400 font-mono">Ctrl+S</span>
                        </button>
                        <hr class="my-1 border-gray-200 dark:border-gray-700">
                        <button onclick="exitApp(); closeAllDropdowns();" class="w-full text-left px-3 py-2 hover:bg-red-50 dark:hover:bg-red-950/30 text-red-600 dark:text-red-400 flex items-center text-xs">
                            <i data-lucide="power" class="w-3.5 h-3.5 mr-2"></i><span data-i18n="exit">Exit</span>
                        </button>
                    </div>
                </div>

                <!-- Edit Menu Dropdown -->
                <div class="relative">
                    <button onclick="toggleDropdown(event, 'edit-dropdown')" class="hover:bg-gray-100 dark:hover:bg-gray-700 active:bg-gray-200 dark:active:bg-gray-600 px-2.5 py-1.5 rounded-md cursor-pointer flex items-center gap-1 font-medium select-none transition-colors" id="menu-edit-btn">
                        <span data-i18n="edit">Edit</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 opacity-60"></i>
                    </button>
                    <div id="edit-dropdown" class="dropdown-menu absolute left-0 mt-1.5 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 hidden z-50 py-1 transition-all animate-in fade-in zoom-in-95 duration-100">
                        <button onclick="execCmd('undo'); closeAllDropdowns();" class="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-between text-xs">
                            <span class="flex items-center"><i data-lucide="undo" class="w-3.5 h-3.5 mr-2 text-amber-500"></i><span data-i18n="undo">Undo</span></span>
                            <span class="text-[10px] text-gray-400 font-mono">Ctrl+Z</span>
                        </button>
                        <button onclick="execCmd('redo'); closeAllDropdowns();" class="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-between text-xs">
                            <span class="flex items-center"><i data-lucide="redo" class="w-3.5 h-3.5 mr-2 text-amber-500"></i><span data-i18n="redo">Redo</span></span>
                            <span class="text-[10px] text-gray-400 font-mono">Ctrl+Y</span>
                        </button>
                        <button onclick="clearFormatting(); closeAllDropdowns();" class="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center text-xs text-gray-700 dark:text-gray-300">
                            <i data-lucide="eraser" class="w-3.5 h-3.5 mr-2 text-red-500"></i><span data-i18n="clearFormatting">Format Normal</span>
                        </button>
                        <hr class="my-1 border-gray-200 dark:border-gray-700">
                        <button onclick="clearAllText(); closeAllDropdowns();" class="w-full text-left px-3 py-2 hover:bg-red-50 dark:hover:bg-red-950/30 text-red-600 dark:text-red-400 flex items-center text-xs">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-2"></i><span data-i18n="clearAll">Clear All</span>
                        </button>
                    </div>
                </div>

                <!-- Settings Modal Trigger -->
                <button onclick="toggleSettingsModal(true); closeAllDropdowns();" class="hover:bg-gray-100 dark:hover:bg-gray-700 active:bg-gray-200 dark:active:bg-gray-600 px-2.5 py-1.5 rounded-md flex items-center gap-1.5 cursor-pointer font-medium select-none transition-colors">
                    <i data-lucide="settings" class="w-3.5 h-3.5 text-indigo-500"></i>
                    <span data-i18n="settings">Pengaturan</span>
                </button>
            </div>

            <!-- Action Controls Right -->
            <div class="flex items-center space-x-2">
                <!-- Checklist Toggle Button -->
                <button onclick="insertChecklist()" class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition" title="Insert Checklist">
                    <i data-lucide="check-square" class="w-4 h-4 text-indigo-500"></i>
                </button>
                <!-- Dark / Light Mode Toggle -->
                <button id="theme-toggle-btn" onclick="toggleDarkMode()" class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition" title="Ganti Mode Terang/Gelap">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
                    <i data-lucide="moon" class="w-4 h-4 block dark:hidden text-indigo-600"></i>
                </button>
                <!-- New Tab Plus Icon Button -->
                <button onclick="createNewTab()" class="p-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded transition" title="New Tab">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Toolbar Formatting Bar -->
        <div class="flex flex-wrap items-center gap-2 px-3 py-1.5 bg-gray-50 dark:bg-gray-800/60 overflow-x-auto border-t border-gray-100 dark:border-gray-700">
            <!-- Text Style / Heading Hierarchy Selector -->
            <div class="flex items-center space-x-1">
                <span class="text-xs text-gray-400 mr-1 hidden sm:inline" data-i18n="textStyle">Gaya:</span>
                <select id="text-style-select" onchange="changeBlockStyle(this.value)" class="text-xs bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium">
                    <option value="p" selected data-i18n="styleBody">Body (Teks Normal)</option>
                    <option value="h1" data-i18n="styleTitle">Title (H1)</option>
                    <option value="h2" data-i18n="styleSubtitle">Subtitle (H2)</option>
                    <option value="h3" data-i18n="styleHeading">Heading (H3)</option>
                    <option value="h4" data-i18n="styleSubheading">Subheading (H4)</option>
                    <option value="h5" data-i18n="styleSection">Section (H5)</option>
                    <option value="h6" data-i18n="styleSubsection">Subsection (H6)</option>
                </select>
            </div>

            <div class="h-4 w-[1px] bg-gray-300 dark:bg-gray-600 mx-1"></div>

            <!-- Font Family Selection -->
            <div class="flex items-center space-x-1">
                <span class="text-xs text-gray-400 mr-1 hidden sm:inline" data-i18n="font">Font:</span>
                <select id="font-family-select" onchange="changeFontFamily(this.value)" class="text-xs bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <option value="font-klasik">Klasik (Times)</option>
                    <option value="font-italic">Italic (Playfair)</option>
                    <option value="font-modern" selected>Modern (Inter)</option>
                    <option value="font-elegan">Elegan (Cinzel)</option>
                    <option value="font-cartoon">Cartoon (Comic)</option>
                    <option value="font-tangan">Tulisan Tangan (Caveat)</option>
                </select>
            </div>

            <!-- Font Size Selection -->
            <div class="flex items-center space-x-1">
                <span class="text-xs text-gray-400 mr-1 hidden sm:inline" data-i18n="fontSize">Ukuran:</span>
                <select id="font-size-select" onchange="changeFontSize(this.value)" class="text-xs bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <option value="12px">12px</option>
                    <option value="14px">14px</option>
                    <option value="16px" selected>16px</option>
                    <option value="18px">18px</option>
                    <option value="20px">20px</option>
                    <option value="24px">24px</option>
                    <option value="28px">28px</option>
                    <option value="32px">32px</option>
                    <option value="40px">40px</option>
                </select>
            </div>

            <div class="h-4 w-[1px] bg-gray-300 dark:bg-gray-600 mx-1"></div>

            <!-- Text Formatting Buttons -->
            <div class="flex items-center space-x-1">
                <button onclick="execCmd('bold')" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-700 rounded font-bold text-xs w-7 h-7 flex items-center justify-center" title="Tebal (Bold)">B</button>
                <button onclick="execCmd('italic')" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-700 rounded italic text-xs w-7 h-7 flex items-center justify-center" title="Miring (Italic)">I</button>
                <button onclick="execCmd('underline')" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-700 rounded underline text-xs w-7 h-7 flex items-center justify-center" title="Garis Bawah (Underline)">U</button>
                <button onclick="execCmd('strikeThrough')" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-700 rounded line-through text-xs w-7 h-7 flex items-center justify-center" title="Coret Teks (Strikethrough)">S</button>
                <button onclick="toggleCaseTransform()" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-xs font-semibold px-2 h-7 flex items-center justify-center" title="Ubah Kapitalisasi">Aa</button>
                <button onclick="clearFormatting()" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-xs px-2 h-7 flex items-center justify-center text-red-500 hover:text-red-600 dark:text-red-400 font-medium" title="Format Normal (Hapus Format Teks)">
                    <i data-lucide="eraser" class="w-3.5 h-3.5 mr-1"></i><span data-i18n="clearFormatting">Normal</span>
                </button>
            </div>

            <div class="h-4 w-[1px] bg-gray-300 dark:bg-gray-600 mx-1"></div>

            <!-- Alignment Buttons -->
            <div class="flex items-center space-x-1">
                <button onclick="execCmd('justifyLeft')" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-700 rounded" title="Rata Kiri"><i data-lucide="align-left" class="w-3.5 h-3.5"></i></button>
                <button onclick="execCmd('justifyCenter')" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-700 rounded" title="Rata Tengah"><i data-lucide="align-center" class="w-3.5 h-3.5"></i></button>
                <button onclick="execCmd('justifyRight')" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-700 rounded" title="Rata Kanan"><i data-lucide="align-right" class="w-3.5 h-3.5"></i></button>
            </div>
        </div>

        <!-- Tab Bar -->
        <div id="tab-bar" class="flex items-center gap-1 px-2 pt-1 bg-gray-200 dark:bg-gray-900 overflow-x-auto border-t border-gray-300 dark:border-gray-700">
            <!-- Dynamic Tabs standard render here -->
        </div>
    </header>

    <!-- Main Writing Workspace Area -->
    <main class="flex-1 relative overflow-hidden flex flex-col p-2 sm:p-4 bg-gray-100 dark:bg-gray-900 transition-all" id="workspace-container">
        <!-- Editor Canvas Paper Card -->
        <div id="paper-editor-wrapper" class="w-full h-full max-w-5xl mx-auto rounded-lg shadow-lg flex flex-col overflow-hidden transition-all duration-300 theme-polos relative">
            <!-- Editable Title -->
            <div class="p-3 border-b border-gray-200/50 dark:border-gray-700/50 flex items-center">
                <input type="text" id="note-title-input" oninput="updateTabTitle(this.value)" placeholder="Catatan Baru..." class="w-full bg-transparent font-bold text-base sm:text-lg focus:outline-none placeholder-gray-400">
            </div>

            <!-- Content Editable Editor Container -->
            <div id="editor" contenteditable="true" oninput="handleEditorInput()" class="flex-1 p-4 sm:p-6 focus:outline-none overflow-y-auto font-modern transition-all text-sm sm:text-base" spellcheck="false"></div>

            <!-- Custom Background Image Overlay Container -->
            <div id="custom-bg-overlay" class="absolute inset-0 pointer-events-none opacity-20 bg-cover bg-center hidden"></div>
        </div>
    </main>

    <!-- Bottom Footer Status Bar -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 px-4 py-1 text-xs text-gray-500 dark:text-gray-400 flex justify-between items-center select-none">
        <div class="flex items-center gap-4">
            <span id="char-count">Karakter: 0</span>
            <span id="word-count">Kata: 0</span>
        </div>
        <div class="flex items-center gap-2">
            <span id="save-status" class="text-green-500 font-medium flex items-center gap-1">
                <i data-lucide="check-circle-2" class="w-3 h-3"></i> Tersimpan
            </span>
        </div>
    </footer>

    <!-- Custom Confirmation Modal Dialog -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden select-none">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-sm p-5 border border-gray-200 dark:border-gray-700 animate-in fade-in zoom-in-95 duration-150">
            <h3 id="confirm-modal-title" class="text-base font-bold text-gray-800 dark:text-gray-100 mb-2">Konfirmasi</h3>
            <p id="confirm-modal-msg" class="text-xs text-gray-600 dark:text-gray-300 mb-5">Apakah Anda yakin?</p>
            <div class="flex justify-end gap-2">
                <button onclick="closeConfirmModal()" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg text-xs font-medium transition-colors">Batal</button>
                <button id="confirm-modal-action-btn" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-medium transition-colors">Proses</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal Dialog -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-md p-6 border border-gray-200 dark:border-gray-700 animate-in fade-in zoom-in-95 duration-150">
            <div class="flex items-center justify-between pb-3 border-b border-gray-200 dark:border-gray-700">
                <h3 class="text-lg font-bold flex items-center gap-2" data-i18n="settingsTitle">
                    <i data-lucide="settings" class="w-5 h-5 text-indigo-500"></i> Pengaturan CORET+
                </h3>
                <button onclick="toggleSettingsModal(false)" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="mt-4 space-y-5 text-sm max-h-[70vh] overflow-y-auto pr-1">
                <!-- 1. Suara Section -->
                <div>
                    <h4 class="font-semibold text-gray-700 dark:text-gray-300 mb-2 flex items-center gap-2">
                        <i data-lucide="volume-2" class="w-4 h-4 text-indigo-500"></i> <span data-i18n="soundEffects">Suara (Sound Effects)</span>
                    </h4>
                    <div class="grid grid-cols-2 gap-2 bg-gray-50 dark:bg-gray-900/50 p-3 rounded-lg border border-gray-200 dark:border-gray-700">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="sound-type" checked onchange="saveSettings()" class="rounded text-indigo-600 focus:ring-indigo-500">
                            <span data-i18n="soundType">Mengetik</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="sound-clear" checked onchange="saveSettings()" class="rounded text-indigo-600 focus:ring-indigo-500">
                            <span data-i18n="soundClear">Hapus Semua</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="sound-checklist" checked onchange="saveSettings()" class="rounded text-indigo-600 focus:ring-indigo-500">
                            <span data-i18n="soundChecklist">Aktifkan Checklist</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="sound-system" checked onchange="saveSettings()" class="rounded text-indigo-600 focus:ring-indigo-500">
                            <span data-i18n="soundSystem">Sistem</span>
                        </label>
                    </div>
                </div>

                <!-- 2. Ganti Background Kustom -->
                <div>
                    <h4 class="font-semibold text-gray-700 dark:text-gray-300 mb-2 flex items-center gap-2">
                        <i data-lucide="image" class="w-4 h-4 text-indigo-500"></i> <span data-i18n="customBg">Latar Belakang Kustom</span>
                    </h4>
                    <div class="space-y-2">
                        <div class="flex gap-2">
                            <input type="text" id="bg-url-input" placeholder="URL Gambar (misal: https://...)" onkeydown="if(event.key==='Enter') saveCustomBgUrl()" class="flex-1 text-xs px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <button onclick="saveCustomBgUrl()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-medium transition-colors flex items-center gap-1 shrink-0">
                                <i data-lucide="save" class="w-3.5 h-3.5"></i> <span data-i18n="saveUrl">Simpan</span>
                            </button>
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="cursor-pointer bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-indigo-100 flex items-center gap-1">
                                <i data-lucide="upload" class="w-3.5 h-3.5"></i> <span data-i18n="uploadImage">Unggah dari File</span>
                                <input type="file" id="bg-file-input" accept="image/*" class="hidden" onchange="handleBgFileUpload(event)">
                            </label>
                            <button onclick="removeCustomBg()" class="text-xs text-red-500 hover:underline" data-i18n="removeBg">Hapus Background</button>
                        </div>
                    </div>
                </div>

                <!-- 3. Ganti Tema -->
                <div>

        // State Management

        // Toggle & Auto Close Dropdown Controllers
        function toggleDropdown(event, dropdownId) {
            if (event) event.stopPropagation();
            playSynthesizedSound('system');
            
            const targetMenu = document.getElementById(dropdownId);
            const isHidden = targetMenu ? targetMenu.classList.contains('hidden') : true;

            closeAllDropdowns();

            if (targetMenu && isHidden) {
                targetMenu.classList.remove('hidden');
            }
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                menu.classList.add('hidden');
            });
        }

        // Global Event Listener for Closing Menus when Clicking Outside
        document.addEventListener('click', (event) => {
            if (!event.target.closest('#menu-file-btn') && 
                !event.target.closest('#menu-edit-btn') && 
                !event.target.closest('.dropdown-menu')) {
                closeAllDropdowns();
            }
        });

        // Web Audio Synthesizer for Sound Effects
        function initAudioContext() {
            if (!audioCtx) {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (AudioCtxClass) {
                    audioCtx = new AudioCtxClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Attach user interaction listeners to unlock Web Audio API automatically
        ['click', 'keydown', 'touchstart'].forEach(eventType => {
            window.addEventListener(eventType, initAudioContext, { once: true });
        });

        function playSynthesizedSound(type) {
            try {
                initAudioContext();
                if (!audioCtx) return;

                const soundTypeChecked = document.getElementById('sound-type')?.checked ?? true;
                const soundClearChecked = document.getElementById('sound-clear')?.checked ?? true;
                const soundChecklistChecked = document.getElementById('sound-checklist')?.checked ?? true;
                const soundSystemChecked = document.getElementById('sound-system')?.checked ?? true;

                if (type === 'type' && !soundTypeChecked) return;
                if (type === 'clear' && !soundClearChecked) return;
                if (type === 'checklist' && !soundChecklistChecked) return;
                if (type === 'system' && !soundSystemChecked) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'type') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(380 + Math.random() * 220, now);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'checklist') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.09); // E5
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'clear') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(70, now + 0.25);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'system') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); // D5
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                }
            } catch (e) {
                console.warn('Synthesizer Audio Error:', e);
            }
        }

        // Custom Confirmation Modal Controller
        function showConfirmModal(title, msg, confirmBtnText, onConfirm) {
            playSynthesizedSound('system');
            document.getElementById('confirm-modal-title').innerText = title;
            document.getElementById('confirm-modal-msg').innerText = msg;
            const actionBtn = document.getElementById('confirm-modal-action-btn');
            actionBtn.innerText = confirmBtnText;
            pendingConfirmAction = onConfirm;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            playSynthesizedSound('system');
            document.getElementById('confirm-modal').classList.add('hidden');
            pendingConfirmAction = null;
        }

        // Initialize Application
        window.addEventListener('DOMContentLoaded', () => {
            loadSavedState();
            if (tabs.length === 0) {
                createNewTab("");
            } else {
                renderTabs();
                switchTab(tabs[0].id);
            }
            lucide.createIcons();
            updateLanguageUI();

            // Bind confirmation action button
            const confirmBtn = document.getElementById('confirm-modal-action-btn');
            if (confirmBtn) {
                confirmBtn.addEventListener('click', () => {
                    if (pendingConfirmAction) {
                        pendingConfirmAction();
                    }
                    closeConfirmModal();
                });
            }

            // Global Keyboard Shortcuts (Ctrl+S, Ctrl+Alt+N)
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                    e.preventDefault();
                    saveFile();
                } else if ((e.ctrlKey || e.metaKey) && e.altKey && e.key.toLowerCase() === 'n') {
                    e.preventDefault();
                    createNewTab();
                }
            });
        });

        // Tab Handling Functions
        function createNewTab(title = "") {
            playSynthesizedSound('system');
            const newTab = {
                id: 'tab_' + Date.now(),
                title: title,
                content: ''
            };
            tabs.push(newTab);
            renderTabs();
            switchTab(newTab.id);
            saveToLocalStorage();
        }

        function switchTab(tabId) {
            saveCurrentTabContent();
            activeTabId = tabId;
            const tab = tabs.find(t => t.id === tabId);
            if (tab) {
                document.getElementById('note-title-input').value = tab.title || '';
                document.getElementById('editor').innerHTML = tab.content;
            }
            renderTabs();
            updateCounts();
        }

        function closeTab(tabId, event) {
            event.stopPropagation();
            if (tabs.length <= 1) {
                // Keep at least one tab open
                tabs = [];
                createNewTab("");
                return;
            }
            tabs = tabs.filter(t => t.id !== tabId);
            if (activeTabId === tabId) {
                activeTabId = tabs[tabs.length - 1].id;
            }
            renderTabs();
            switchTab(activeTabId);
            saveToLocalStorage();
        }

        function renderTabs() {
            const tabBar = document.getElementById('tab-bar');
            tabBar.innerHTML = '';
            const defaultTabTitle = currentLanguage === 'id' ? 'Catatan Baru' : 'New Note';
            tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const tabEl = document.createElement('div');
                tabEl.className = `flex items-center gap-2 px-3 py-1.5 rounded-t-md text-xs cursor-pointer select-none border-t border-x transition-all ${
                    isActive 
                        ? 'bg-white dark:bg-gray-800 border-gray-300 dark:border-gray-700 text-indigo-600 dark:text-indigo-400 font-semibold' 
                        : 'bg-gray-100 dark:bg-gray-900 border-transparent text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-800'
                }`;
                tabEl.onclick = () => switchTab(tab.id);

                tabEl.innerHTML = `
                    <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                    <span class="max-w-[100px] truncate">${escapeHtml(tab.title || defaultTabTitle)}</span>
                    <button onclick="closeTab('${tab.id}', event)" class="hover:text-red-500 rounded p-0.5">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                `;
                tabBar.appendChild(tabEl);
            });
            lucide.createIcons();
        }

        function updateTabTitle(newTitle) {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab) {
                tab.title = newTitle;
                renderTabs();
                saveToLocalStorage();
            }
        }

        function saveCurrentTabContent() {
            if (!activeTabId) return;
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab) {
                tab.content = document.getElementById('editor').innerHTML;
            }
        }

        function handleEditorInput() {
            playSynthesizedSound('type');
            saveCurrentTabContent();
            updateCounts();
            saveToLocalStorage();
        }

        function execCmd(command, value = null) {
            playSynthesizedSound('system');
            document.execCommand(command, false, value);
            document.getElementById('editor').focus();
        }

        function toggleCaseTransform() {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const text = selection.toString();
            if (!text) return;

            const isUpper = text === text.toUpperCase();
            const transformed = isUpper ? text.toLowerCase() : text.toUpperCase();
            document.execCommand('insertText', false, transformed);
            playSynthesizedSound('system');
        }

        function clearFormatting() {
            playSynthesizedSound('system');
            const selection = window.getSelection();
            if (!selection || !selection.rangeCount) return;

            const editor = document.getElementById('editor');
            const range = selection.getRangeAt(0);

            // Reset style block format back to paragraph (Body)
            try {
                document.execCommand('formatBlock', false, '<p>');
                const styleSelect = document.getElementById('text-style-select');
                if (styleSelect) styleSelect.value = 'p';
            } catch (e) {}

            if (selection.isCollapsed) {
                // Jika tidak ada teks yang diblok/diseleksi, hapus elemen format di posisi kursor
                let node = selection.anchorNode;
                if (node) {
                    let current = node.nodeType === 3 ? node.parentElement : node;
                    while (current && current !== editor) {
                        if (['SPAN', 'FONT', 'B', 'I', 'U', 'S', 'STRIKE', 'EM', 'STRONG'].includes(current.tagName)) {
                            const parent = current.parentNode;
                            while (current.firstChild) {
                                parent.insertBefore(current.firstChild, current);
                            }
                            parent.removeChild(current);
                            current = parent;
                        } else {
                            current.removeAttribute('style');
                            current.removeAttribute('class');
                            current = current.parentElement;
                        }
                    }
                }
            } else {
                // Jika ada teks yang diseleksi, bersihkan semua tag format & inline style
                try {
                    document.execCommand('removeFormat', false, null);
                    document.execCommand('unlink', false, null);

                    const extracted = range.extractContents();
                    const container = document.createElement('div');
                    container.appendChild(extracted);

                    function cleanNode(node) {
                        if (node.nodeType === 1) {
                            node.removeAttribute('style');
                            node.removeAttribute('class');
                            node.removeAttribute('size');
                            node.removeAttribute('color');

                            const unwrapTags = ['SPAN', 'FONT', 'B', 'I', 'U', 'S', 'STRIKE', 'EM', 'STRONG', 'MARK'];
                            if (unwrapTags.includes(node.tagName)) {
                                const parent = node.parentNode;
                                while (node.firstChild) {
                                    cleanNode(node.firstChild);
                                    parent.insertBefore(node.firstChild, node);
                                }
                                parent.removeChild(node);
                                return;
                            }
                        }
                        let child = node.firstChild;
                        while (child) {
                            const next = child.nextSibling;
                            cleanNode(child);
                            child = next;
                        }
                    }

                    cleanNode(container);

                    const frag = document.createDocumentFragment();
                    while (container.firstChild) {
                        frag.appendChild(container.firstChild);
                    }

                    range.insertNode(frag);
                    selection.removeAllRanges();
                } catch (e) {
                    document.execCommand('removeFormat', false, null);
                }
            }

            editor.focus();
            handleEditorInput();
        }

        function insertChecklist() {
            playSynthesizedSound('checklist');
            const checklistHtml = `<div class="flex items-center space-x-2 my-1" contenteditable="false">
                <input type="checkbox" onchange="playSynthesizedSound('checklist')" class="w-4 h-4 text-indigo-600 rounded cursor-pointer">
                <span contenteditable="true" class="focus:outline-none flex-1">Item Checklist</span>
            </div>&nbsp;`;
            document.execCommand('insertHTML', false, checklistHtml);
        }

        function clearAllText() {
            const isId = currentLanguage === 'id';
            showConfirmModal(
                isId ? 'Hapus Semua Teks' : 'Clear All Text',
                isId ? 'Apakah Anda yakin ingin menghapus seluruh teks pada catatan ini?' : 'Are you sure you want to clear all text in this note?',
                isId ? 'Hapus' : 'Clear',
                () => {
                    playSynthesizedSound('clear');
                    document.getElementById('editor').innerHTML = '';
                    saveCurrentTabContent();
                    updateCounts();
                    saveToLocalStorage();
                }
            );
        }

        function updateCounts() {
            const text = document.getElementById('editor').innerText || '';
            const charCount = text.length;
            const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;

            const dict = i18nDict[currentLanguage];
            document.getElementById('char-count').innerText = `${dict.chars}${charCount}`;
            document.getElementById('word-count').innerText = `${dict.words}${wordCount}`;
        }

        function changeFontFamily(fontClass) {
            currentFont = fontClass;
            const editor = document.getElementById('editor');
            editor.className = editor.className.replace(/font-\w+/g, '');
            editor.classList.add(fontClass);
            playSynthesizedSound('system');
            saveSettings();
        }

        function changeFontSize(size) {
            playSynthesizedSound('system');
            const selection = window.getSelection();
            if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
                document.execCommand('fontSize', false, '7');
                const fontElements = document.querySelectorAll('#editor font[size="7"]');
                fontElements.forEach(el => {
                    const span = document.createElement('span');
                    span.style.fontSize = size;
                    span.innerHTML = el.innerHTML;
                    el.parentNode.replaceChild(span, el);
                });
            } else {
                document.getElementById('editor').style.fontSize = size;
            }
            handleEditorInput();
        }

        function changeBlockStyle(tagName) {
            playSynthesizedSound('system');
            if (!tagName) return;
            try {
                // Applying Heading block format (H1, H2, H3, H4, H5, H6, P)
                document.execCommand('formatBlock', false, `<${tagName}>`);
            } catch (e) {
                try {
                    document.execCommand('formatBlock', false, tagName);
                } catch (err) {
                    console.error('Error changing text style block:', err);
                }
            }
            document.getElementById('editor').focus();
            handleEditorInput();
        }

        function changeTheme(themeClass) {
            currentTheme = themeClass;
            const wrapper = document.getElementById('paper-editor-wrapper');
            wrapper.className = wrapper.className.replace(/theme-\w+/g, '');
            wrapper.classList.add(themeClass);
            playSynthesizedSound('system');
            saveSettings();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            playSynthesizedSound('system');
            saveSettings();
        }

        function applyCustomBg(url) {
            customBgUrl = url;
            const overlay = document.getElementById('custom-bg-overlay');
            if (url) {
                overlay.style.backgroundImage = `url('${url}')`;
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
            saveSettings();
        }

        function saveCustomBgUrl() {
            const url = document.getElementById('bg-url-input').value.trim();
            applyCustomBg(url);
            playSynthesizedSound('system');
        }

        function handleBgFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    document.getElementById('bg-url-input').value = '';
                    applyCustomBg(dataUrl);
                };
                reader.readAsDataURL(file);
            }
        }

        function removeCustomBg() {
            document.getElementById('bg-url-input').value = '';
            applyCustomBg('');
        }

        async function saveFile() {
            saveCurrentTabContent();
            saveToLocalStorage();
            playSynthesizedSound('system');

            const currentTab = tabs.find(t => t.id === activeTabId);
            if (!currentTab) return;

            // Jika berkas sudah memiliki fileHandle lokasi penyimpanan sebelumnya di File Manager
            if (currentTab.fileHandle) {
                try {
                    const textContent = document.getElementById('editor').innerText;
                    const writable = await currentTab.fileHandle.createWritable();
                    await writable.write(textContent);
                    await writable.close();
                    showSaveNotification(currentLanguage === 'id' ? 'Tersimpan ke Berkas!' : 'Saved to File!');
                    return;
                } catch (err) {
                    console.warn('Gagal menyimpan ke lokasi file lama, membukakan dialog simpan baru:', err);
                    currentTab.fileHandle = null;
                }
            }

            // Jika belum memiliki lokasi file simpan, jalankan Save As ke File Manager Perangkat
            await saveFileAs();
        }

        async function saveFileAs() {
            saveCurrentTabContent();
            saveToLocalStorage();
            playSynthesizedSound('system');

            const currentTab = tabs.find(t => t.id === activeTabId);
            const textContent = document.getElementById('editor').innerText;
            const defaultName = currentLanguage === 'id' ? 'Catatan Baru' : 'New Note';
            const filename = ((currentTab && currentTab.title) ? currentTab.title : defaultName) + '.txt';

            // Menggunakan File System Access API agar pengguna memilih folder di File Manager PC/Perangkat
            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{
                            description: 'Dokumen Teks (*.txt)',
                            accept: { 'text/plain': ['.txt', '.md'] },
                        }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(textContent);
                    await writable.close();
                    
                    // Menyimpan acuan lokasi berkas pada memori tab agar Ctrl+S selanjutnya langsung update file ini
                    if (currentTab) {
                        currentTab.fileHandle = handle;
                        if (handle.name) {
                            const cleanName = handle.name.replace(/\.[^/.]+$/, "");
                            currentTab.title = cleanName;
                            document.getElementById('note-title-input').value = cleanName;
                            renderTabs();
                            saveToLocalStorage();
                        }
                    }

                    showSaveNotification(currentLanguage === 'id' ? 'Berhasil disimpan ke folder!' : 'Saved to folder!');
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return; // Pengguna membatalkan dialog pemilihan
                    console.warn('File System Access API tidak didukung/diizinkan, beralih ke pengunduhan berkas:', err);
                }
            }

            // Fallback untuk browser/HP yang tidak mendukung showSaveFilePicker
            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            URL.revokeObjectURL(a.href);
            showSaveNotification(currentLanguage === 'id' ? 'Berkas Diunduh ke Perangkat!' : 'Downloaded to Device!');
        }

        function showSaveNotification(msg) {
            const status = document.getElementById('save-status');
            if (status) {
                status.innerHTML = `<i data-lucide="check-circle-2" class="w-3 h-3"></i> ${msg}`;
                lucide.createIcons();
                status.classList.remove('opacity-0');
                setTimeout(() => {
                    status.classList.add('opacity-0');
                }, 2500);
            }
        }

        function exitApp() {
            const isId = currentLanguage === 'id';
            showConfirmModal(
                isId ? 'Tutup Aplikasi' : 'Exit App',
                isId ? 'Apakah Anda yakin ingin menutup aplikasi CORET+?' : 'Are you sure you want to exit CORET+?',
                isId ? 'Keluar' : 'Exit',
                () => {
                    playSynthesizedSound('system');
                    const exitOverlay = document.getElementById('exit-overlay');
                    if (exitOverlay) {
                        const titleEl = document.getElementById('exit-overlay-title');
                        const descEl = document.getElementById('exit-overlay-desc');
                        const hintEl = document.getElementById('exit-overlay-hint');
                        if (titleEl) titleEl.innerText = isId ? 'CORET+ Telah Ditutup' : 'CORET+ Closed';
                        if (descEl) descEl.innerText = isId ? 'Klik di mana saja untuk membuka kembali aplikasi.' : 'Click anywhere to reopen the app.';
                        if (hintEl) hintEl.innerText = isId ? 'Klik Sembarang Tempat Untuk Kembali' : 'Click Anywhere To Return';
                        exitOverlay.classList.remove('hidden');
                        lucide.createIcons();
                    }
                }
            );
        }

        function restoreApp() {
            playSynthesizedSound('system');
            const exitOverlay = document.getElementById('exit-overlay');
            if (exitOverlay) {
                exitOverlay.classList.add('hidden');
            }
        }

        function toggleSettingsModal(show) {
            playSynthesizedSound('system');
            const modal = document.getElementById('settings-modal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function changeLanguage(lang) {
            currentLanguage = lang;
            updateLanguageUI();
            playSynthesizedSound('system');
            saveSettings();
        }

        function updateLanguageUI() {
            const dict = i18nDict[currentLanguage];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) {
                    el.innerText = dict[key];
                }
            });
            const inputEl = document.getElementById('note-title-input');
            if (inputEl) {
                inputEl.placeholder = dict.defaultNoteTitle;
            }
            renderTabs();
            updateCounts();
        }

        function saveToLocalStorage() {
            localStorage.setItem('coret_tabs', JSON.stringify(tabs));
            localStorage.setItem('coret_active_tab', activeTabId);
        }

        function saveSettings() {
            const settings = {
                soundType: document.getElementById('sound-type').checked,
                soundClear: document.getElementById('sound-clear').checked,
                soundChecklist: document.getElementById('sound-checklist').checked,
                soundSystem: document.getElementById('sound-system').checked,
                customBgUrl: customBgUrl,
                theme: currentTheme,
                font: currentFont,
                lang: currentLanguage,
                isDark: document.documentElement.classList.contains('dark')
            };
            localStorage.setItem('coret_settings', JSON.stringify(settings));
        }

        function loadSavedState() {
            // Load Tabs
            const savedTabs = localStorage.getItem('coret_tabs');
            if (savedTabs) {
                try { tabs = JSON.parse(savedTabs); } catch (e) { tabs = []; }
            }
            const savedActiveId = localStorage.getItem('coret_active_tab');
            if (savedActiveId && tabs.some(t => t.id === savedActiveId)) {
                activeTabId = savedActiveId;
            }

            // Load Settings
            const savedSettings = localStorage.getItem('coret_settings');
            if (savedSettings) {
                try {
                    const s = JSON.parse(savedSettings);
                    document.getElementById('sound-type').checked = s.soundType ?? true;
                    document.getElementById('sound-clear').checked = s.soundClear ?? true;
                    document.getElementById('sound-checklist').checked = s.soundChecklist ?? true;
                    document.getElementById('sound-system').checked = s.soundSystem ?? true;
                    
                    if (s.customBgUrl) {
                        applyCustomBg(s.customBgUrl);
                        document.getElementById('bg-url-input').value = s.customBgUrl;
                    }

                    if (s.theme) {
                        changeTheme(s.theme);
                        document.getElementById('theme-select').value = s.theme;
                    }

                    if (s.font) {
                        changeFontFamily(s.font);
                        document.getElementById('font-family-select').value = s.font;
                    }

                    if (s.lang) {
                        currentLanguage = s.lang;
                        document.getElementById('lang-select').value = s.lang;
                    }

                    if (s.isDark) {
                        document.documentElement.classList.add('dark');
                    }
                } catch (e) {}
            }
        }

        // Helper Utility
        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
